# Read the Docs builds the SWATrust tutorial as this file says.
# The site is a MkDocs site. Every package it is built with is pinned in requirements.txt, and the
# build fails on a warning, as the local build does (mkdocs build --strict).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    - requirements: requirements.txt

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

# No `formats:` entry, on purpose: the host builds no PDF, ePub or archive of the pages, so its menu
# offers no download of the tutorial.
